appId: com.coursenest.desktop
productName: CourseNest
copyright: "Copyright © 2026 CourseNest Authors. Open Source Apache 2.0"
directories:
  buildResources: build
  output: release
files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - package.json
artifactName: "${productName}-Setup-${version}.${ext}"
linux:
  target:
    - AppImage
    - deb
  category: Education
  icon: build/icon.png
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signtoolOptions:
    sign: scripts/windows-sign.cjs
    rfc3161TimeStampServer: "http://timestamp.digicert.com"
nsis:
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: "CourseNest Educational Studio"
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "CourseNest"
  differentialPackage: false
portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

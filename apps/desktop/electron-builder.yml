appId: com.coursenest.desktop
productName: CourseNest
directories:
  buildResources: build
  output: release
files:
  - dist-electron/**/*
  - dist/renderer/**/*
linux:
  target:
    - AppImage
    - deb
  category: Education
  icon: build/icon.png
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CourseNest — Local-First Offline Learning Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%2357C564' d='M16 2L4 8l12 6 12-6-12-6z'/><path fill='%2338A145' d='M4 12l12 6 12-6v4l-12 6-12-6v-4z'/><path fill='%23F59E0B' d='M16 24l-8-4v3l8 4 8-4v-3l-8 4z'/></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('coursenest_active_theme_v3') || localStorage.getItem('coursenest_active_theme_id') || localStorage.getItem('cn-theme');
          var darkThemes = ['obsidian', 'cyberpunk', 'oled', 'dark'];
          var validThemes = ['obsidian', 'halal', 'sakura', 'toybox', 'cyberpunk', 'manga', 'ghibli', 'oled', 'paper'];
          var theme = 'obsidian';
          if (saved === 'dark') theme = 'obsidian';
          else if (saved === 'light') theme = 'paper';
          else if (saved && validThemes.indexOf(saved) !== -1) theme = saved;
          document.documentElement.setAttribute('data-theme', theme);
          if (darkThemes.indexOf(theme) !== -1) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-cn-bg text-cn-text-primary antialiased selection:bg-[#57C564]/20 selection:text-[#57C564]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
